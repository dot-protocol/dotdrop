name: Build Debug APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build_apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove proprietary dependencies
        run: sh scripts/remove_proprietary_dependencies.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build debug APK (arm64)
        working-directory: app
        run: flutter build apk --debug --target-platform android-arm64

      - name: Rename APK
        run: |
          mv app/build/app/outputs/flutter-apk/app-debug.apk \
             app/build/app/outputs/flutter-apk/PiedPiper-android-0.1.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiedPiper-android-debug
          path: app/build/app/outputs/flutter-apk/PiedPiper-android-0.1.0-debug.apk

      - name: Upload to release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/app/outputs/flutter-apk/PiedPiper-android-0.1.0-debug.apk
          draft: false
          prerelease: false
